<!DOCTYPE html>
<html>
<head>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.body.innerHTML = "ERROR: " + msg + " at line " + lineNo + ":" + columnNo;
      fetch('http://localhost:12345/log', {
        method: 'POST',
        body: "ERROR: " + msg + " at line " + lineNo + ":" + columnNo
      });
      return false;
    };
  </script>
  <script src="app.js"></script>
</head>
<body>
  No error detected.
</body>
</html>
